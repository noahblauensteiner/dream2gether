name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Privacy guard (no real recordings in the repo)
        run: |
          leaked=$(git ls-files | grep -iE '\.(m4a|wav|mp3|ogg|opus|flac|aac)$' | grep -v '^eval/synthetic/' || true)
          if [ -n "$leaked" ]; then
            echo "Audio files outside eval/synthetic/ are not allowed:"
            echo "$leaked"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build
